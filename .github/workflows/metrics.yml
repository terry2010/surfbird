name: metrics

# Daily: pull npm download counts + Docker Hub pull/star counts →
# append metrics/data.jsonl → regenerate dashboard.md → commit back.

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily (release runs at 02:00)
  workflow_dispatch:

concurrency:
  group: surfbird-metrics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits data.jsonl + dashboard.md back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect metrics
        run: node scripts/metrics.mjs

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/data.jsonl dashboard.md
          git diff --cached --quiet && exit 0
          git commit -m "metrics: daily update"
          git pull --rebase
          git push
