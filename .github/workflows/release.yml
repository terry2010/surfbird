name: release

# Daily: check cloudflare/kitesurf for a new tag → build both image variants →
# smoke-test against real sites → push to Docker Hub only if tests pass.
# Manual: Actions → release → Run workflow (optionally pin a tag / force).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream kitesurf tag to build (blank = latest)"
        required: false
        type: string
      force:
        description: "rebuild+push even if this tag was already released"
        required: false
        type: boolean
        default: false

concurrency:
  group: surfbird-release
  cancel-in-progress: false

permissions:
  contents: read # jobs that need more declare it themselves

env:
  IMAGE: terry2010/surfbird

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh api repos/cloudflare/kitesurf/tags --paginate --jq '.[].name' | sort -V | tail -1)
          fi
          [ -n "$tag" ] || { echo "could not resolve upstream tag" >&2; exit 1; }
          # charset check — the tag later lands inside a shell-expanded git fetch
          case "$tag" in
            *[!A-Za-z0-9._/-]*|-*) echo "invalid tag: $tag" >&2; exit 1 ;;
          esac
          last=$(cat upstream-tag.txt || true)
          echo "latest upstream tag: $tag (last released: $last, force: ${INPUT_FORCE:-false})"
          changed=false
          [ "$tag" != "$last" ] && changed=true
          [ "${INPUT_FORCE:-false}" = "true" ] && changed=true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # commits the released tag back to upstream-tag.txt
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build raw + auth (load locally)
        run: |
          set -e
          for t in raw auth; do
            docker buildx build \
              --target "$t" \
              --build-arg KITESURF_REF="$TAG" \
              --label "org.opencontainers.image.version=$TAG" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --cache-from "type=gha,scope=$t" \
              --cache-to "type=gha,mode=max,scope=$t" \
              --load -t "${IMAGE}:$t" -t "${IMAGE}:$t-$TAG" .
          done

      - name: Smoke test (auth image, real sites)
        run: bash scripts/ci-smoke.sh "${IMAGE}:auth"

      - name: Smoke test (raw image, boot check)
        run: |
          set -e
          docker run -d --name surfbird-ci-raw -p 127.0.0.1:18787:8787 "${IMAGE}:raw" >/dev/null
          ok=""
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18787/json/version >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          logs=$(docker logs surfbird-ci-raw 2>&1 | tail -30)
          docker rm -f surfbird-ci-raw >/dev/null
          [ -n "$ok" ] || { echo "FAIL: raw engine never answered"; printf '%s\n' "$logs"; exit 1; }
          echo "raw engine up"

      - name: Push all tags
        run: |
          set -e
          docker tag "${IMAGE}:auth" "${IMAGE}:latest"
          for ref in "raw-$TAG" "auth-$TAG" "raw" "auth" "latest"; do
            docker push "${IMAGE}:$ref"
          done

      - name: Sync README to Docker Hub overview
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Unofficial self-hosted Cloudflare Kitesurf headless browser for AI agents: markdown, PDF, CDP"
          enable-url-completion: true

      - name: Record released upstream tag
        run: |
          echo "$TAG" > upstream-tag.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream-tag.txt
          git diff --cached --quiet && exit 0
          git commit -m "release: upstream kitesurf $TAG"
          # the build takes ~20min — other pushes may have landed meanwhile
          git pull --rebase
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rel="kitesurf-$TAG"
          if gh release view "$rel" >/dev/null 2>&1; then
            echo "release $rel already exists, skipping"
            exit 0
          fi
          cat > /tmp/notes.md <<NOTES
          Docker images built from upstream [kitesurf $TAG](https://github.com/cloudflare/kitesurf/releases/tag/$TAG).

          | image | pull |
          |---|---|
          | auth — REST actions + token auth + optional TLS | \`docker pull terry2010/surfbird:auth-$TAG\` |
          | raw — engine + CDP only | \`docker pull terry2010/surfbird:raw-$TAG\` |

          Floating tags \`raw\` / \`auth\` / \`latest\` point at this build.
          Unofficial distribution — not affiliated with Cloudflare.
          NOTES
          gh release create "$rel" \
            --target "$(git rev-parse HEAD)" \
            --title "kitesurf $TAG" \
            --notes-file /tmp/notes.md
