name: hub-readme

# Manual: Actions → hub-readme → Run workflow
# Syncs README.md to the Docker Hub repo overview without a full image rebuild.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: terry2010/surfbird
          short-description: "Unofficial self-hosted Cloudflare Kitesurf headless browser for AI agents: markdown, PDF, CDP"
          enable-url-completion: true
