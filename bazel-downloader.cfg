# Bazel downloader URL rewrites — China-friendly defaults.
# Patterns match the URL without scheme; replacement carries the scheme.
# First match wins as primary candidate; originals kept as fallback.

rewrite github.com/(.*) https://ghfast.top/https://github.com/$1
rewrite raw.githubusercontent.com/(.*) https://ghfast.top/https://raw.githubusercontent.com/$1
rewrite codeload.github.com/(.*) https://ghfast.top/https://codeload.github.com/$1
rewrite objects.githubusercontent.com/(.*) https://ghfast.top/https://objects.githubusercontent.com/$1

# rust toolchain dist: static.rust-lang.org crawls in CN; aliyun keeps the full
# dated archive (tuna/ustc prune nightlies older than ~1 month)
rewrite static.rust-lang.org/(.*) https://mirrors.aliyun.com/rustup/$1

# fallback to origin (reachable outside CN or with local proxy)
rewrite github.com/(.*) https://github.com/$1
rewrite raw.githubusercontent.com/(.*) https://raw.githubusercontent.com/$1
rewrite codeload.github.com/(.*) https://codeload.github.com/$1
rewrite objects.githubusercontent.com/(.*) https://objects.githubusercontent.com/$1
rewrite static.rust-lang.org/(.*) https://static.rust-lang.org/$1
